services:
  openapi-audit:
    build: .
    image: openapi-contract-audit:latest
    container_name: openapi-contract-audit
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8080/health')).get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
